      <circle cx="20" cy="22" r="5" fill="#38bdf8" />
      <text x="34" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Consumer Storefront</text>
      <text x="34" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">React 19 &bull; Multi-Currency</text>
