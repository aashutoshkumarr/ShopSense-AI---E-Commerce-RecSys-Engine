      <text x="12" y="22" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="800">SSE Event Stream</text>
      <text x="12" y="40" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Push GPS Waypoints</text>
      <text x="12" y="58" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Rider Telemetry</text>
      <text x="12" y="76" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Real-time Heatmaps</text>
      <text x="12" y="94" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Reconnection Backoff</text>
    </g>
