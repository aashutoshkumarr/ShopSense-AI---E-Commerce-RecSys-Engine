      <text x="12" y="38" fill="#6ee7b7" font-family="sans-serif" font-size="9">Live Camera Inspection</text>
      <text x="12" y="50" fill="#a7f3d0" font-family="sans-serif" font-size="8">Fraud ML &bull; Escrow Shield</text>
    </g>

    <!-- Domain 6: UPI 2.0 Fintech -->
    <g transform="translate(920, 35)">
      <rect width="160" height="60" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
      <text x="12" y="22" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="800">UPI 2.0 &amp; Fintech</text>
      <text x="12" y="38" fill="#7dd3fc" font-family="sans-serif" font-size="9">Double-Entry Ledger</text>
