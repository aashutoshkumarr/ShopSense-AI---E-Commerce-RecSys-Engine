      <text x="10" y="20" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="800">1. Retrieval</text>
      <text x="10" y="38" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Vector Cosine</text>
      <text x="10" y="56" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Item-Item CF</text>
      <text x="10" y="74" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Markov Window</text>
      <text x="10" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Fresh Velocity</text>
