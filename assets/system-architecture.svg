    <text x="20" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">CLIENT TOUCHPOINTS</text>

    <!-- Tile 1: Consumer Storefront -->
    <g transform="translate(180, 10)">
