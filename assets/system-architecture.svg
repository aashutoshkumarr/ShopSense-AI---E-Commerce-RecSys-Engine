    <!-- Tile 2: Merchant Center -->
    <g transform="translate(410, 10)">
      <rect width="210" height="45" rx="8" fill="url(#card-client)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="20" cy="22" r="5" fill="#818cf8" />
      <text x="34" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Merchant Center</text>
      <text x="34" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Buy Box Dynamic Repricer</text>
