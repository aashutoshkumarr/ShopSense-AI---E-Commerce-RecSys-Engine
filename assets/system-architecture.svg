      <text x="10" y="74" fill="#ecfdf5" font-family="sans-serif" font-size="9">&bull; Tree Shapley</text>
      <rect x="8" y="85" width="109" height="18" rx="4" fill="#064e3b" />
      <text x="62" y="97" fill="#34d399" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">NDCG@10: 0.884</text>
