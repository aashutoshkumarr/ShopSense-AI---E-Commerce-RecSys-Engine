    <!-- Tile 3: Fleet Delivery App -->
    <g transform="translate(640, 10)">
      <rect width="210" height="45" rx="8" fill="url(#card-client)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="20" cy="22" r="5" fill="#34d399" />
      <text x="34" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Dark Store Fleet Partner</text>
      <text x="34" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">10-Min Live GPS &bull; OTP Handshake</text>
    </g>

    <!-- Tile 4: Observability & Admin -->
    <g transform="translate(870, 10)">
      <rect width="210" height="45" rx="8" fill="url(#card-client)" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="22" r="5" fill="#f59e0b" />
      <text x="34" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Observability Console</text>
      <text x="34" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">SRE Flame Graph &bull; Breakers</text>
    </g>
