      <text x="12" y="38" fill="#7dd3fc" font-family="sans-serif" font-size="9">Sub-&#8377;999 Value Score</text>
      <text x="12" y="50" fill="#94a3b8" font-family="sans-serif" font-size="8">Progressive Multi-Buy</text>
