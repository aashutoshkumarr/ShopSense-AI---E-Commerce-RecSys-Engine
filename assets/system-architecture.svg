      <circle cx="20" cy="20" r="6" fill="#f59e0b" />
      <text x="34" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">Netflix Hystrix Circuit Breakers</text>
      <text x="34" y="42" fill="#a1a1aa" font-family="sans-serif" font-size="10">CLOSED &harr; OPEN &harr; HALF_OPEN &bull; Instant Fallbacks</text>
