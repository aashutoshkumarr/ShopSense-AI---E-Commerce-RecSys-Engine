      <text x="12" y="58" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Partitioned Telemetry</text>
      <text x="12" y="76" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; Double-Entry Ledgers</text>
      <text x="12" y="94" fill="#fed7aa" font-family="sans-serif" font-size="9">&bull; 210+ Master Catalog</text>
    </g>

    <!-- DB 2: Redis Distributed Keyspace -->
    <g transform="translate(180, 42)">
      <rect width="150" height="110" rx="8" fill="#1c0e05" stroke="#dc2626" stroke-width="1" />
      <text x="12" y="22" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="800">Redis Keyspace</text>
      <text x="12" y="40" fill="#fecaca" font-family="sans-serif" font-size="9">&bull; Atomic Counters INCR</text>
      <text x="12" y="58" fill="#fecaca" font-family="sans-serif" font-size="9">&bull; Strict TTL Eviction</text>
      <text x="12" y="76" fill="#fecaca" font-family="sans-serif" font-size="9">&bull; User Session State</text>
      <text x="12" y="94" fill="#fecaca" font-family="sans-serif" font-size="9">&bull; Top-K Cache: &lt;1ms</text>
