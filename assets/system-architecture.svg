      <text x="10" y="38" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Similarity Delta</text>
      <text x="10" y="56" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Brand Affinity</text>
      <text x="10" y="74" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Price Elasticity</text>
      <text x="10" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Real-time CTR</text>
    </g>

    <!-- Arrow -->
