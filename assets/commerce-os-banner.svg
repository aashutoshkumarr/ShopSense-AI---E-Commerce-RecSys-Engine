<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="140" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="200" r="100" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="36" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FAANG-GRADE COMMERCE OS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">ShopSense AI</text>
  <text x="60" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Autonomous Commerce Operating System &amp; RecSys Engine</text>

  <!-- Subtitle Description -->
  <text x="60" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Multi-stage LambdaMART LTR &bull; OpenTelemetry W3C Tracing &bull; Netflix Hystrix Circuit Breakers &bull; UPI 2.0 Ledger &bull; Camera OLX ReCommerce
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 275)">
    <!-- Badge 1: Test Suite -->
    <rect width="180" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">AUTOMATED TESTS</text>
    <text x="20" y="44" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="900">95 / 95 Passed</text>

    <!-- Badge 2: Latency SLA -->
    <g transform="translate(200, 0)">
      <rect width="180" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">P95 INFERENCE SLA</text>
      <text x="20" y="44" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="900">&lt; 18 ms</text>
    </g>

    <!-- Badge 3: Audit Score -->
    <g transform="translate(400, 0)">
      <rect width="180" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">DEPLOYMENT GATES</text>
      <text x="20" y="44" fill="#c084fc" font-family="sans-serif" font-size="18" font-weight="900">100% Verified</text>
    </g>

    <!-- Badge 4: Catalog Size -->
    <g transform="translate(600, 0)">
      <rect width="180" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">EXPANDED CATALOG</text>
      <text x="20" y="44" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="900">210+ Products</text>
    </g>

    <!-- Badge 5: Multi-Currency -->
    <g transform="translate(800, 0)">
      <rect width="180" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">GLOBAL CURRENCIES</text>
      <text x="20" y="44" fill="#f43f5e" font-family="sans-serif" font-size="18" font-weight="900">6 FX Locales</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 355)">
    <rect width="1080" height="34" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#ef4444" />
    <circle cx="36" cy="17" r="4" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4" fill="#10b981" />
    <text x="75" y="22" fill="#94a3b8" font-family="'Courier New', Courier, monospace" font-size="12">
      shopsense-ai --mode=production --port=3000 --tracing=opentelemetry-w3c --resilience=hystrix-active [SYSTEM HEALTH: NOMINAL]
    </text>
  </g>
</svg>
