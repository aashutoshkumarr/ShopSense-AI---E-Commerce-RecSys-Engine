      <text x="10" y="20" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="800">4. MMR Rerank</text>
      <text x="10" y="38" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Intra-Diversity</text>
      <text x="10" y="56" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Category Quota</text>
      <text x="10" y="74" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Stock Hard-Filter</text>
      <text x="10" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="9">&bull; Explanations</text>
