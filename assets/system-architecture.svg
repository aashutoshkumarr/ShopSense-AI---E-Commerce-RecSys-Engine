<svg width="1200" height="740" viewBox="0 0 1200 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Layer Card Gradients -->
    <linearGradient id="card-client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="card-gateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-resilience" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="card-commerce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2238" />
      <stop offset="100%" stop-color="#091422" />
    </linearGradient>
    <linearGradient id="card-ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062d22" />
      <stop offset="100%" stop-color="#021a13" />
    </linearGradient>
    <linearGradient id="card-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1205" />
      <stop offset="100%" stop-color="#180a02" />
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="accent-cyan" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="740" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid Dots -->
  <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
  </pattern>
  <rect width="1200" height="740" fill="url(#dot-grid)" opacity="0.5" />

  <!-- Diagram Title Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">ENTERPRISE SYSTEM ARCHITECTURE</text>
    <text x="0" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">ShopSense AI &bull; Commerce Operating System (Commerce OS)</text>
    <text x="0" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      High-throughput, resilient micro-domain pipeline with OpenTelemetry distributed tracing &amp; LightGBM LambdaMART LTR
    </text>
  </g>

