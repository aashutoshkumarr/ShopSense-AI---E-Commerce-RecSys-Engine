name: ShopSense AI Commerce OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Run 95-Test Automated Suite
        run: npm test

      - name: Production Client & Server Build
        run: npm run build

      - name: Verify Docker Container Build
        if: matrix.node-version == '22.x'
        run: docker build -t shopsense-ai-commerce-os:latest .
